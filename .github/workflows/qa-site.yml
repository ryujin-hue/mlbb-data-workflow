name: QA Site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "worker/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/qa-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-site
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --- worker ---
      - name: Worker unit test (jalankan normalizer sungguhan vs upstream)
        working-directory: worker
        run: npm install --no-audit --no-fund && npm test

      - name: Worker typecheck
        working-directory: worker
        run: npm run typecheck

      # --- web ---
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Web typecheck + build
        working-directory: web
        run: npm run build

      - name: Cek ukuran bundle
        run: |
          # Bundle JS/CSS dikira TANPA aset audio - lagu hero ~4.8 MB dan ia
          # bukan bundle kod, jadi tidak ikut dikira sebagai "bundle kegedean".
          total=$(du -sk --exclude=audio site | cut -f1)
          echo "site/ (tanpa audio): ${total} KB"
          test "$total" -lt 1200 || { echo "Bundle kegedean (>1.2 MB)"; exit 1; }
          if [ -d site/audio ]; then
            echo "site/audio/: $(du -sk site/audio | cut -f1) KB"
          fi

      - name: Cek aset lagu hero
        run: |
          test -d site/audio/PICS || { echo "folder aset audio hilang"; exit 1; }
          # Nama folder mengandungi koma dan ruang - jangan diubah.
          test -f "site/audio/PICS/Mathilda/336387.mp3" || { echo "fail audio Mathilda hilang"; exit 1; }
          test -f "site/audio/PICS/Miya,layla/336388.mp3" || { echo "fail audio Miya/Layla hilang"; exit 1; }
          test -f "site/audio/PICS/Vexana,Valentina/336390.mp3" || { echo "fail audio Vexana/Valentina hilang"; exit 1; }
          test -f "site/audio/PICS/Bruno,nolan,Fredrinn,aamon,brody/Tik4Down_01_emergency_-_breakbeat_breakbeat.mp3" || { echo "fail audio Bruno hilang"; exit 1; }
          test -f "site/audio/PICS/Camila,hanabi,alice,edith/Tik4Down_02_fanny_skin_aspirant_kau_pikir_hidup_ini_cuma_makan_batu_danc.mp3" || { echo "fail audio Camila hilang"; exit 1; }
          test -f "site/audio/PICS/Dori,hirara,zetian,fanny ,floryn/Tik4Down_03_pinjem_helm_yah_riri_jipon.mp3" || { echo "fail audio Dori hilang"; exit 1; }
          echo "Aset lagu hero OK."

      # --- smoke test browser ---
      - name: Install Playwright
        run: |
          python3 -m pip install --upgrade pip
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Smoke test Meta Center v2
        run: python3 tests/smoke_test_v2.py

      # --- keamanan ---
      - name: Scan kebocoran secret
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=node_modules \
            -E "ghp_[A-Za-z0-9]{20,}|github_pat_|-----BEGIN [A-Z ]*PRIVATE KEY-----" .; then
            echo "Secret terdeteksi di repository!"
            exit 1
          fi
          echo "Tidak ada secret yang terdeteksi."

      - name: Cek header keamanan
        run: |
          test -f site/_headers || { echo "site/_headers hilang"; exit 1; }
          grep -q "Content-Security-Policy" site/_headers || { echo "CSP tidak ada"; exit 1; }
          grep -q "script-src 'self'" site/_headers || { echo "script-src harus 'self'"; exit 1; }
          echo "Header keamanan OK."
